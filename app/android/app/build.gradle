plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Configuración de firma release. Busca `android/key.properties` con:
//   storeFile=ruta al .keystore
//   storePassword=...
//   keyAlias=flavor-news-hub
//   keyPassword=...
// Si el archivo no existe, el release build cae a la debug keystore —
// útil en desarrollo pero incompatible entre máquinas: sólo firmado
// real garantiza que la app se pueda actualizar. En CI, el workflow
// reconstruye key.properties a partir de secrets antes de compilar.
def propiedadesKey = new Properties()
def archivoKey = rootProject.file("key.properties")
def hayFirmaRelease = archivoKey.exists()
if (hayFirmaRelease) {
    archivoKey.withInputStream { propiedadesKey.load(it) }
}

android {
    namespace = "org.flavornewshub.flavor_news_hub"
    compileSdk = flutter.compileSdkVersion
    // NDK pineado: el default `flutter.ndkVersion` cambia entre versiones
    // del SDK Flutter (ahora trae 23.1.7779620) y 9 plugins del proyecto
    // (audio_service, audio_session, just_audio, home_widget,
    // flutter_local_notifications, open_filex, package_info_plus,
    // path_provider_android, receive_sharing_intent) exigen ≥25.1.8937393.
    // Sin pinear, los builds dependen de qué versión de Flutter haya
    // instalada en cada máquina/CI — lo hacíamos antes y Gradle nos
    // metía warnings en cada release. Pineamos a la que pide la mayoría.
    ndkVersion = "25.1.8937393"

    compileOptions {
        // `flutter_local_notifications` 17+ exige core library desugaring
        // para usar java.time en API levels antiguos.
        coreLibraryDesugaringEnabled = true
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "org.flavornewshub.flavor_news_hub"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Distribución dual:
    //   - `libre`: F-Droid, IzzyOnDroid, GitHub Releases, Obtainium. Lleva
    //     el flujo OTA (REQUEST_INSTALL_PACKAGES + FileProvider + queries
    //     APK MIME, todo declarado en src/libre/AndroidManifest.xml).
    //   - `playstore`: Google Play. Sin OTA — Play prohíbe esa permission.
    // Ambos comparten applicationId; signing fragmentado (libre con
    // keystore propia, playstore con Play App Signing) implica que un
    // mismo dispositivo no puede tener los dos a la vez ni migrar entre
    // canales sin desinstalar.
    flavorDimensions += "canal"
    productFlavors {
        libre {
            dimension = "canal"
        }
        playstore {
            dimension = "canal"
        }
    }

    signingConfigs {
        release {
            if (hayFirmaRelease) {
                storeFile file(propiedadesKey.getProperty('storeFile'))
                storePassword propiedadesKey.getProperty('storePassword')
                keyAlias propiedadesKey.getProperty('keyAlias')
                keyPassword propiedadesKey.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Usar la keystore de release si hay `key.properties`; si
            // no, caer a debug para que `flutter run --release` siga
            // funcionando durante desarrollo. Para distribución real
            // (Play Store, F-Droid, GitHub Releases) `key.properties`
            // es obligatorio.
            signingConfig = hayFirmaRelease ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Split por ABI: genera un APK por arquitectura (arm, arm64, x86_64).
    // Reduce el tamaño de cada APK ~35-40% porque cada uno sólo lleva el
    // código nativo de su CPU. Para distribución F-Droid o GitHub Releases
    // se sube cada uno por separado; `universalApk` mantiene además un
    // APK "todo en uno" para quien no quiera elegir.
    splits {
        abi {
            enable project.hasProperty('split-per-abi')
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Desugaring runtime para java.time y APIs similares.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // Media3/ExoPlayer para el RadioService nativo del widget Sintonizador.
    // Necesitamos el reproductor + commonweb para leer streams Icecast/Shoutcast
    // con extracción automática de metadatos ICY (StreamTitle del programa
    // que se está emitiendo). MediaPlayer del SDK no expone ICY.
    def versionMedia3 = "1.4.1"
    implementation "androidx.media3:media3-exoplayer:$versionMedia3"
    implementation "androidx.media3:media3-common:$versionMedia3"
    // media3-session da el MediaSession (Media3) cuyo token enlazamos a la
    // notificación foreground del RadioService. Sin esto la notificación
    // del foreground service era un Notification normal — funcional pero
    // no integrada con los media controls de Android.
    implementation "androidx.media3:media3-session:$versionMedia3"
    // androidx.media (legacy) trae `MediaStyle` para NotificationCompat,
    // que es lo que el sistema reconoce como "notificación de media" y
    // promueve a la sección "Now playing" / lockscreen. Se vincula al
    // token del MediaSession Media3 vía `setMediaSession(platformToken)`.
    implementation "androidx.media:media:1.7.0"
}

// Pin de `androidx.work` para que todas las dependencias resuelvan a la
// misma versión. workmanager 0.9.x accede a `WorkManager.Companion` (un
// objeto Kotlin añadido en androidx.work 2.9.0). Sin este pin, otras
// dependencias arrastraban 2.8.1 y la app crasheaba en arranque con
// `NoSuchFieldError: No field Companion of type WorkManager$Companion`
// dentro del `GeneratedPluginRegistrant`, dejando la app en pantalla
// negra. 2.10.x es la última estable y mantiene API con 2.9.
configurations.all {
    resolutionStrategy {
        force "androidx.work:work-runtime:2.10.0"
        force "androidx.work:work-runtime-ktx:2.10.0"
    }
}
