name: App · build & test

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-build.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app-build.yml'

jobs:
  flutter:
    name: Flutter analyze, test, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        # El toolchain de Android moderno requiere Java 17 o superior.
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        # Fijamos 3.41.9 para coincidir con la versión usada en
        # desarrollo. La migración a l10n no-sintético (commit
        # af3d4eb) eliminó la dependencia de `flutter_gen`, así que
        # ya se puede usar Flutter 3.41+ aquí también.
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Pub get
        run: flutter pub get

      - name: Generate freezed + json_serializable
        # Los `.freezed.dart` y `.g.dart` no se commitean; se regeneran
        # en cada build. `--delete-conflicting-outputs` evita errores si
        # algún archivo quedó desactualizado.
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        # `--no-fatal-infos` deja pasar avisos cosméticos (prefer_const,
        # prefer_function_declarations…) que no indican bugs. Errores y
        # warnings siguen siendo bloqueantes.
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test

      - name: Android unit tests (Robolectric)
        # Smoke tests JVM de los AppWidgetProviders nativos. Robolectric
        # simula el framework Android sin emulador, así que corren en el
        # runner normal. Verifican que los 6 providers cargan y `onUpdate`
        # no peta — la clase de fallo que dejó la app en negro tras bumps
        # de toolchain. `--flavor libre` ya se compila abajo; aquí basta
        # la variante de unit test del mismo flavor.
        working-directory: app/android
        run: ./gradlew :app:testLibreDebugUnitTest

      - name: Build APK (debug, flavor libre)
        # APK debug en lugar de release porque no firmamos aún. La
        # validación real aquí es "compila limpio para Android"; la
        # firma + release APK llegará en una tarea específica cuando
        # se publique la primera versión. `--flavor libre` desde
        # v0.11.0 (distribución dual): sin él, Gradle no puede elegir
        # entre los flavors y la build falla.
        run: flutter build apk --debug --flavor libre

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavor-news-hub-debug-apk
          path: app/build/app/outputs/flutter-apk/app-libre-debug.apk
          if-no-files-found: error
          retention-days: 7
